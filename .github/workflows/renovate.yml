name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      log_level:
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # nix-update rebuilds the APK, which needs room for the Android SDK and NDK.
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      # The Gradle lock update script sandboxes itself with bubblewrap.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: alldebrid
      - run: >-
          nix shell --inputs-from .
          nixpkgs#renovate nixpkgs#nix-update nixpkgs#flutter
          -c renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: "Renovate Bot <29139614+renovate[bot]@users.noreply.github.com>"
          RENOVATE_ALLOWED_COMMANDS: '["^nix-update --flake android --version=skip$"]'
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
