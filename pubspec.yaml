name: alldebrid
description: "AllDebrid client for Android and Linux."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  background_downloader: ^9.6.4
  dio: ^5.11.1
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: assets/icon.png
  min_sdk_android: 24
